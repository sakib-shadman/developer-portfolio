pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,mjs,astro,json,md,yml,css}'
      run: pnpm exec prettier --check {staged_files}
    eslint:
      glob: '*.{js,ts,mjs,astro}'
      run: pnpm exec eslint {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
