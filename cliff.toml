# git-cliff config: https://git-cliff.org/docs/configuration
# Generates the changelog from Conventional Commits (types per commitlint.config.js).
# Squash-merge titles look like `type(scope): subject (PF-12) (#34)`; the trailing PR number is linked.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Generated by git-cliff (`pnpm changelog`).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"
# The release commit itself and merge commits are noise.
commit_parsers = [
  { message = "^release", skip = true },
  { message = "^Merge", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^content", group = "<!-- 03 -->Content" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^refactor", group = "<!-- 05 -->Refactoring" },
  { message = "^style", group = "<!-- 06 -->Styling" },
  { message = "^test", group = "<!-- 07 -->Tests" },
  { message = "^build", group = "<!-- 08 -->Build" },
  { message = "^ci", group = "<!-- 09 -->CI" },
  { message = "^chore", group = "<!-- 10 -->Chores" },
  { message = "^revert", group = "<!-- 11 -->Reverts" },
]
