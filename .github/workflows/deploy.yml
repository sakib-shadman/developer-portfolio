name: deploy
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  SITE_URL: https://shadman-portfolio.web.app
  # live = push/dispatch on main; everything else is a preview or staging deploy
  IS_LIVE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  deploy:
    # Fork PRs have no secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Until Firebase is set up (see docs/IMPLEMENTATION_PLAN.md §4.4) skip instead of failing.
      - name: Check Firebase is configured
        id: gate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHADMAN_PORTFOLIO }}
        run: |
          if [ -z "$SA" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::FIREBASE_SERVICE_ACCOUNT_SHADMAN_PORTFOLIO is not set yet"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm build
        env:
          PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          PUBLIC_INDEXABLE: ${{ env.IS_LIVE == 'true' && vars.PUBLIC_INDEXABLE || 'false' }}
          PUBLIC_CONTACT_FORM: 'false'
          # Explicit false also overrides any stray .env file (process.env wins in Vite).
          PUBLIC_INCLUDE_DRAFTS: 'false'
          PUBLIC_CONTENT_FIXTURES: 'false'
      - if: steps.gate.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHADMAN_PORTFOLIO }}
          projectId: shadman-portfolio
          # '' → auto-named PR preview channel (URL posted on the PR)
          channelId: ${{ github.event_name == 'pull_request' && '' || (env.IS_LIVE == 'true' && 'live' || 'staging') }}
          expires: ${{ github.event_name == 'pull_request' && '7d' || '30d' }}
      - name: Smoke test live site
        if: steps.gate.outputs.enabled == 'true' && env.IS_LIVE == 'true'
        run: |
          pnpm exec playwright install --with-deps chromium
          BASE_URL=${{ env.SITE_URL }} pnpm exec playwright test --project=chromium --grep @smoke
