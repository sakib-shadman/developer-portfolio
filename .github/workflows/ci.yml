name: ci
on:
  pull_request:
    branches: [develop, main]
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop / release/* / hotfix/* may target main
        env: { BASE: '${{ github.base_ref }}', HEAD: '${{ github.head_ref }}' }
        run: |
          if [[ "$BASE" != "main" ]]; then echo "base=$BASE → no restriction"; exit 0; fi
          if [[ "$HEAD" == "develop" || "$HEAD" == release/* || "$HEAD" == hotfix/* ]]; then exit 0; fi
          echo "::error::PRs into main must come from develop, release/* or hotfix/* (got $HEAD)"; exit 1

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      # These steps are the single source of truth for "what CI checks": `pnpm verify` (scripts/verify.mjs)
      # reads this job's `run:` steps and build env from this file, so dropping or changing a gate here is
      # a visible diff, and local and CI cannot drift apart.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_SITE_URL: 'https://shadman-portfolio.web.app'
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_INCLUDE_DRAFTS: 'false'
          PUBLIC_CONTENT_FIXTURES: 'false'

  e2e:
    runs-on: ubuntu-latest
    # The official Playwright image: the browsers (chromium, firefox, webkit) and the system fonts are baked
    # in, so CI and `pnpm e2e:docker` run on the same OS, fonts and browser builds. The tag MUST equal the
    # @playwright/test version in pnpm-lock.yaml (tests/unit/ci-parity.test.ts enforces it). The hosting
    # emulator serves static files in-process and needs no Java. GitHub runs containers as root with
    # HOME=/github/home owned by the runner (uid 1001); Firefox refuses to start as root in a home that
    # belongs to someone else, so the job runs as that user (Playwright's GitHub container guidance).
    # Workspace, tool cache and HOME are all owned by 1001, so checkout, setup-node, pnpm and the cache work.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    env:
      E2E_CONTAINER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The three passes are defined once in scripts/e2e-passes.mjs (shared with `pnpm e2e:docker`).
      - name: e2e (real content, drafts included, all browsers)
        run: node scripts/e2e-passes.mjs real
      # What ships has no drafts: smoke + axe must pass on that build too.
      - name: e2e smoke + axe without drafts
        run: node scripts/e2e-passes.mjs shipped
      # Fictional, fully populated content (tests/fixtures/content): blog, case studies, photo, email,
      # resume. Builds into dist-fixtures/ on its own port; never touches the real-content build.
      - name: e2e @fixtures suite
        run: node scripts/e2e-passes.mjs fixtures
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # Stays on the plain runner: Lighthouse launches the runner's Chrome (the Playwright image has none on
  # chrome-launcher's search path) and the ADR-0006 budgets were calibrated there.
  lighthouse:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 1. Every route of the fixtures build against the ADR-0006 budgets (noindex build: `is-crawlable` skipped).
      - run: pnpm build:fixtures
      - run: pnpm lhci
      - if: always()
        run: node scripts/lhci-report.mjs .lighthouseci/fixtures
      # 2. Indexable production build so SEO = 1 (including `is-crawlable`) is measured as production will be.
      - run: pnpm build
        env:
          {
            PUBLIC_SITE_URL: 'https://shadman-portfolio.web.app',
            PUBLIC_INDEXABLE: 'true',
            PUBLIC_INCLUDE_DRAFTS: 'false',
            PUBLIC_CONTENT_FIXTURES: 'false',
          }
      - run: pnpm lhci:indexable
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: lighthouse-reports, path: .lighthouseci, retention-days: 7 }
