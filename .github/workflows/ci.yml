name: ci
on:
  pull_request:
    branches: [develop, main]
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop / release/* / hotfix/* may target main
        env: { BASE: '${{ github.base_ref }}', HEAD: '${{ github.head_ref }}' }
        run: |
          if [[ "$BASE" != "main" ]]; then echo "base=$BASE → no restriction"; exit 0; fi
          if [[ "$HEAD" == "develop" || "$HEAD" == release/* || "$HEAD" == hotfix/* ]]; then exit 0; fi
          echo "::error::PRs into main must come from develop, release/* or hotfix/* (got $HEAD)"; exit 1

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          {
            PUBLIC_SITE_URL: 'https://shadman-portfolio.web.app',
            PUBLIC_INDEXABLE: 'false',
            PUBLIC_INCLUDE_DRAFTS: 'false',
            PUBLIC_CONTENT_FIXTURES: 'false',
          }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm e2e
        env: { CI: 'true', PUBLIC_INCLUDE_DRAFTS: 'true', PUBLIC_CONTENT_FIXTURES: 'false' }
      # What ships has no drafts: smoke + axe must pass on that build too.
      - name: e2e smoke + axe without drafts
        run: pnpm exec playwright test --project=chromium --grep "@smoke|axe"
        env:
          { CI: 'true', PUBLIC_INCLUDE_DRAFTS: 'false', PUBLIC_CONTENT_FIXTURES: 'false', E2E_PORT: '5050' }
      # Fictional, fully populated content (tests/fixtures/content): blog, case studies, photo, email,
      # resume. Builds into dist-fixtures/ on its own port; never touches the real-content build.
      - name: e2e @fixtures suite
        run: pnpm e2e:fixtures
        env: { CI: 'true', E2E_FIXTURES_PORT: '5390' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Indexable build so the SEO category is measured as production will be.
      - run: pnpm build
        env:
          {
            PUBLIC_SITE_URL: 'https://shadman-portfolio.web.app',
            PUBLIC_INDEXABLE: 'true',
            PUBLIC_INCLUDE_DRAFTS: 'false',
            PUBLIC_CONTENT_FIXTURES: 'false',
          }
      - run: pnpm lhci
