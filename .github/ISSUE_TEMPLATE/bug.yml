name: Bug
description: Something on the site is broken
labels: ["type:bug"]
body:
  - type: input
    id: url
    attributes: { label: Page URL }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Browser / device, placeholder: "iOS 18 Safari, iPhone 15" }
