# pnpm 10 settings.
# Install native binaries for macOS arm64 AND linux arm64 (glibc), so the same node_modules
# works both on the Mac and in the Linux VM Claude uses on this machine
# (sharp, esbuild, rolldown, lightningcss, astro compiler, lefthook).
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64]
  libc: [current, glibc]

# pnpm 10 blocks dependency build scripts unless allow-listed.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - lefthook

# firebase-tools transitive natives not needed for Hosting (re2 needs node-gyp).
ignoredBuiltDependencies:
  - protobufjs
  - re2

# eslint-plugin-astro auto-installs eslint-plugin-jsx-a11y as an optional peer; we use the
# eslint-10-compatible fork (eslint-plugin-jsx-a11y-x), so silence the stale peer range.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
