# pnpm 10 settings.
# Install native binaries for the dev VM (linux) AND macOS arm64, so node_modules
# works on the Mac without reinstalling (sharp, esbuild, rolldown, lefthook).
supportedArchitectures:
  os: [current, darwin]
  cpu: [current, arm64]

# pnpm 10 blocks dependency build scripts unless allow-listed.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - lefthook
